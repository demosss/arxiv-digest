[project]
name = "arxiv-digest-backend"
version = "1.0.0"
description = "arXiv Digest: сбор препринтов, суммаризация локальной LLM, PDF-дайджест и рассылка"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "email-validator>=2.2,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "celery>=5.4,<6",
    "structlog>=24.4",
    "bcrypt>=4.2",
    "pyjwt>=2.9,<3",
    "httpx>=0.27,<1",
    "feedparser>=6.0.11,<7",
    "pymupdf>=1.24",
    "jinja2>=3.1,<4",
    "weasyprint>=63",
    "croniter>=3.0",
    "openai>=1.50",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "types-croniter",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
# RUF001-003: кириллица в строках и комментариях — это нормально для проекта
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "feedparser.*", "pymupdf.*", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q -p no:cacheprovider"

[tool.ruff.lint.isort]
# каталог миграций alembic/ не должен превращать библиотеку alembic в first-party
known-third-party = ["alembic"]
