# Темы для мониторинга arXiv — автономный транспорт.
#
# Формат запросов — синтаксис arXiv API:
#   ti:  — заголовок, abs: — аннотация, all: — все поля, cat: — категория
#   AND / OR / ANDNOT (ЗАГЛАВНЫМИ), скобки, "фразы в кавычках".
# Строка без префиксов и операторов считается фразой: autonomous ship → all:"autonomous ship".
# Запросы внутри темы работают как OR. Если заданы categories, к каждому запросу добавляется
# AND (cat:... OR cat:...).
#
# ВАЖНО: arXiv ищет только по метаданным (заголовок, аннотация, авторы, комментарии), а не
# по полному тексту, как Google Scholar. Поэтому узкие маркеры вроде "ISO 34503" или
# "PAS 1883" почти всегда дадут 0 результатов за сутки. Такие запросы оставлены только там,
# где термин реально встречается в аннотациях.

topics:
  - name: "ODD — концепция, формализация, мониторинг"
    description: "Operational Design Domain: определение, таксономии, языки описания, выход за границы ODD"
    categories: []          # без ограничения — тема узкая
    is_active: true
    queries:
      - 'all:"operational design domain"'
      - 'all:"operational design domains"'
      - 'abs:ODD AND (abs:autonomous OR abs:automated OR abs:"self-driving")'
      - 'all:"operational domain" AND (all:autonomous OR all:automated)'
      - 'all:"operational envelope" AND (all:autonomous OR all:unmanned)'
      - 'all:"operating conditions" AND all:"automated driving" AND (all:specification OR all:ontology OR all:taxonomy)'
      - 'all:OpenODD'

  - name: "Безопасность, верификация и сертификация автономного транспорта"
    description: "SOTIF, safety case, scenario-based testing, стандарты и сертификация"
    categories: []
    is_active: true
    queries:
      - 'all:SOTIF'
      - 'all:"ISO 21448"'
      - 'all:"UL 4600"'
      - 'all:"ISO 26262" AND (all:autonomous OR all:automated)'
      - 'all:"safety case" AND (all:autonomous OR all:automated OR all:unmanned)'
      - 'all:"safety assurance" AND (all:"autonomous vehicle" OR all:"automated driving" OR all:"autonomous ship" OR all:"autonomous train")'
      - 'all:"scenario-based" AND (all:testing OR all:verification OR all:validation) AND (all:"automated driving" OR all:"autonomous driving" OR all:"autonomous vehicle")'
      - '(all:certification OR all:homologation OR all:"type approval") AND (all:"autonomous vehicle" OR all:"automated driving" OR all:"autonomous ship" OR all:"autonomous vessel" OR all:"autonomous train")'
      - 'all:"runtime monitoring" AND (all:"autonomous vehicle" OR all:"automated driving")'

  - name: "Автономный морской транспорт"
    description: "MASS, автономные суда, безэкипажные надводные аппараты, COLREG"
    categories: []
    is_active: true
    queries:
      - 'all:"autonomous ship"'
      - 'all:"autonomous ships"'
      - 'all:"autonomous vessel"'
      - 'all:"autonomous vessels"'
      - 'all:"maritime autonomous surface ship"'
      - 'all:"autonomous surface vessel"'
      - 'all:"unmanned surface vehicle"'
      - 'all:"unmanned surface vessel"'
      - 'all:COLREG OR all:COLREGs'
      - 'all:maritime AND (all:autonomous OR all:autonomy) AND (all:navigation OR all:"collision avoidance" OR all:perception)'

  - name: "Внутренний водный и речной транспорт"
    description: "Автономные речные суда, inland waterways, smart shipping"
    categories: []
    is_active: true
    queries:
      - 'all:"inland waterway"'
      - 'all:"inland waterways"'
      - 'all:"inland vessel"'
      - 'all:"inland navigation"'
      - 'all:"inland shipping"'
      - 'all:river AND (all:vessel OR all:ship OR all:boat) AND (all:autonomous OR all:unmanned OR all:"collision avoidance")'
      - 'all:"smart shipping"'

  - name: "Автономный железнодорожный транспорт"
    description: "ATO, GoA3/GoA4, беспилотные поезда, обнаружение препятствий на пути"
    categories: []
    is_active: true
    queries:
      - 'all:"autonomous train"'
      - 'all:"autonomous trains"'
      - 'all:"driverless train"'
      - 'all:"automatic train operation"'
      - 'all:GoA4 OR all:"grade of automation"'
      - '(all:railway OR all:railways OR all:rail) AND (all:autonomous OR all:automation OR all:"obstacle detection")'
      - 'all:train AND all:"obstacle detection"'

  - name: "Датасеты для обучения нейросетей автономного транспорта"
    description: "Новые датасеты, бенчмарки, разметка и синтетические данные"
    categories: ["cs.CV", "cs.RO", "cs.LG", "cs.AI"]
    is_active: true
    queries:
      - '(ti:dataset OR ti:benchmark) AND (all:"autonomous driving" OR all:"automated driving" OR all:"self-driving")'
      - '(ti:dataset OR ti:benchmark) AND (all:maritime OR all:vessel OR all:ship OR all:"surface vehicle" OR all:river)'
      - '(ti:dataset OR ti:benchmark) AND (all:railway OR all:rail OR all:train)'
      - '(all:"synthetic data" OR all:simulation) AND all:dataset AND (all:"autonomous driving" OR all:"autonomous vehicle" OR all:"autonomous ship")'
      - '(all:annotation OR all:labeling OR all:"auto-labeling") AND (all:"autonomous driving" OR all:"autonomous vehicle")'

  - name: "Перенос концепций между видами транспорта"
    description: "Кросс-доменные подходы: авто ↔ море ↔ ЖД ↔ авиация/БАС"
    categories: []
    is_active: true
    queries:
      - '(all:"operational design domain" OR all:"safety case" OR all:"levels of automation") AND (all:maritime OR all:railway OR all:aviation OR all:UAS OR all:drone)'
      - 'all:"cross-domain" AND all:autonomous AND (all:maritime OR all:railway OR all:automotive OR all:aviation)'
      - 'all:"levels of autonomy" AND (all:ship OR all:vessel OR all:train OR all:railway)'

  # Широкая тема: 20–60 статей в сутки. Включайте, только если готовы к нагрузке
  # на локальную LLM (суммаризация по полному тексту) и к объёмному дайджесту.
  - name: "Автономное вождение — общий поток"
    description: "Все работы по беспилотным автомобилям: планирование, восприятие, управление"
    categories: ["cs.RO", "cs.CV", "cs.AI", "cs.LG", "eess.SY", "cs.SY"]
    is_active: false
    queries:
      - 'ti:"autonomous driving"'
      - 'ti:"automated driving"'
      - 'ti:"self-driving"'
      - 'ti:"autonomous vehicle" OR ti:"autonomous vehicles"'
